      - REDIS_PASSWORD=${REDIS_PASSWORD_AUTH}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS}
      - OTEL_ENDPOINT=otel-collector:4317
