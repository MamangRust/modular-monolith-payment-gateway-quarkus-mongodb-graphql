services:
  mongo:
    image: mongo:7
    container_name: mongo
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pyroscope:
    image: grafana/pyroscope:latest
    ports:
      - 4040:4040
    networks:
      - app_network

  redis-node-1:
    image: redis:7.4
    container_name: redis_node_1
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6379:6379"
    volumes:
      - redis_node_1_data:/data
    networks:
      - app_network

  redis-node-2:
    image: redis:7.4
    container_name: redis_node_2
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6380:6379"
    volumes:
      - redis_node_2_data:/data
    networks:
      - app_network

  redis-node-3:
    image: redis:7.4
    container_name: redis_node_3
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6381:6379"
    volumes:
      - redis_node_3_data:/data
    networks:
      - app_network

  redis-node-4:
    image: redis:7.4
    container_name: redis_node_4
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6382:6379"
    volumes:
      - redis_node_4_data:/data
    networks:
      - app_network

  redis-node-5:
    image: redis:7.4
    container_name: redis_node_5
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6383:6379"
    volumes:
      - redis_node_5_data:/data
    networks:
      - app_network

  redis-node-6:
    image: redis:7.4
    container_name: redis_node_6
    command: redis-server --port 6379 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass dragon_knight --masterauth dragon_knight
    ports:
      - "6384:6379"
    volumes:
      - redis_node_6_data:/data
    networks:
      - app_network

  redis-cluster-init:
    image: redis:7.4
    container_name: redis_cluster_init
    command: >
      sh -c "sleep 5 &&
      echo 'yes' | redis-cli -a dragon_knight --cluster create
      redis-node-1:6379
      redis-node-2:6379
      redis-node-3:6379
      redis-node-4:6379
      redis-node-5:6379
      redis-node-6:6379
      --cluster-replicas 1"
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    networks:
      - app_network

  node-exporter:
    image: quay.io/prometheus/node-exporter
    container_name: node-exporter
    pid: "host"
    networks:
      - app_network
    volumes:
      - "/:/host:ro,rslave"
    command:
      - "--path.rootfs=/host"

  kafka:
    image: apache/kafka:latest
    container_name: my-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: kraft-cluster-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - app_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules
    networks:
      - app_network
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - app_network
    depends_on:
      - prometheus
      - jaeger
      - alertmanager
      - loki

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - apigateway
    networks:
      - app_network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
      - "8889:8889"
    depends_on:
      - jaeger
    networks:
      - app_network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - app_network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    container_name: kafka-exporter
    ports:
      - "9308:9308"
    networks:
      - app_network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "--kafka.server=my-kafka:9092"
      - "--web.listen-address=0.0.0.0:9308"
      - "--log.level=debug"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:9308/metrics || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    container_name: loki
    image: grafana/loki:3.5.8
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app_network

  db-migration:
    build:
      context: ../..
      dockerfile: db-migration/Dockerfile
    image: monolith-payment-gateway-grpc-vertx/db-migration:latest
    container_name: db-migration
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy

  apigateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    image: monolith-payment-gateway-grpc-vertx/apigateway:latest
    container_name: apigateway
    env_file: ./docker.env
    volumes:
      - ./docker.env:/app/docker.env
    ports:
      - "5000:5000"
      - "8091:8091"
    networks:
      - app_network
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      auth:
        condition: service_started
      card:
        condition: service_started
      merchant:
        condition: service_started
      user:
        condition: service_started
      role:
        condition: service_started
      saldo:
        condition: service_started
      topup:
        condition: service_started
      transaction:
        condition: service_started
      transfer:
        condition: service_started
      withdraw:
        condition: service_started
    environment:
      - REDIS_HOST=${REDIS_HOST_APIGATEWAY}
      - REDIS_PORT=${REDIS_PORT_APIGATEWAY}
      - REDIS_PASSWORD=${REDIS_PASSWORD_APIGATEWAY}
      - REDIS_CLUSTER_ENABLED=${REDIS_CLUSTER_ENABLED}
      - REDIS_CLUSTER_ENDPOINTS=${REDIS_CLUSTER_ENDPOINTS}
      - OTEL_ENDPOINT=otel-collector:4317
      - APP_ENV=docker
      - KAFKA_BROKERS=kafka:9092
      - HTTP_PORT=5000

  auth:
