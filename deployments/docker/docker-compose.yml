volumes:
  loki-data:
  grafana-storage:
  mongo_data:
  kafka_data:
  redis_node_1_data:
  redis_node_2_data:
  redis_node_3_data:
  redis_node_4_data:
  redis_node_5_data:
  redis_node_6_data:

networks:
  app_network:
    driver: bridge